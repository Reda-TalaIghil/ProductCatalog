version: 2.1

jobs:
  build:
    working_directory: ~/ProductCatalog
    docker:
      # Use a modern Android image with Java 17
      - image: cimg/android:2024.09

    environment:
      JVM_OPTS: -Xmx3200m

    steps:
      - checkout

      # Fix Gradle wrapper permissions
      - run:
          name: Make gradlew executable
          command: chmod +x ./gradlew

      # Verify Java version (should be Java 17)
      - run:
          name: Show Java version
          command: java -version

      # Restore Gradle cache
      - restore_cache:
          key: jars-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}

      # Download dependencies
      - run:
          name: Download Dependencies
          command: ./gradlew dependencies --no-daemon

      # Save cache again after fetch
      - save_cache:
          paths:
            - ~/.gradle
          key: jars-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}

      # Run tests
      - run:
          name: Run Unit Tests
          command: ./gradlew test --no-daemon

      # Store APK artifacts
      - store_artifacts:
          path: app/build/outputs/apk/debug/
          destination: apks/

      # Store test results
      - store_test_results:
          path: app/build/test-results
